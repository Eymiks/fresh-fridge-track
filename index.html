<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FreshTrack - Suivi des péremptions</title>
    <meta name="description" content="Suivez les dates de péremption de vos produits et réduisez le gaspillage alimentaire.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥬</text></svg>" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FreshTrack - Suivi des péremptions">
  <meta name="twitter:title" content="FreshTrack - Suivi des péremptions">
  <meta property="og:description" content="Suivez les dates de péremption de vos produits et réduisez le gaspillage alimentaire.">
  <meta name="twitter:description" content="Suivez les dates de péremption de vos produits et réduisez le gaspillage alimentaire.">
  <meta name="twitter:card" content="summary">
</head>

  <body>
    <div id="root"></div>
    <script>
      (function() {
        var mode = localStorage.getItem('frigo-theme-mode');
        var legacy = localStorage.getItem('frigo-dark-mode');
        var isDark = mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) ||
          (!mode && legacy === 'true');
        if (isDark) document.documentElement.classList.add('dark');
        var accents = { blue:'215 80% 55%', violet:'263 70% 60%', orange:'22 90% 52%', rose:'340 75% 58%', cyan:'190 75% 42%' };
        var a = localStorage.getItem('frigo-accent-color');
        if (a && accents[a]) {
          document.documentElement.style.setProperty('--primary', accents[a]);
          document.documentElement.style.setProperty('--ring', accents[a]);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
